<!-- PDF 酷炫弹窗 90%窗口 全套功能 -->
<div *ngIf="showModal" class="fixed inset-0 z-[9999]">
  <!-- 磨砂遮罩 -->
  <div
    @fadeInMask
    class="absolute inset-0 bg-black/70 backdrop-blur-sm"
    (click)="closeModal()"
  ></div>

  <!-- 弹窗主体 90vw 90vh 动画弹出 -->
  <div
    @zoomModal
    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2
    w-[90vw] h-[90vh] rounded-2xl overflow-hidden shadow-2xl
    bg-white dark:bg-gray-900 flex flex-col"
    (contextmenu)="$event.preventDefault()"
  >
    <!-- 顶部工具栏 -->
    <div class="h-14 flex items-center justify-between px-4 border-b border-gray-200 dark:border-gray-700">
      <span class="font-medium text-gray-700 dark:text-gray-200">PDF 在线预览</span>
      <div class="flex items-center gap-2">
        <!-- 暗黑模式 -->
        <button (click)="toggleDark()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
          <mat-icon class="text-gray-600 dark:text-gray-300">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
        <!-- 全屏 -->
        <button (click)="enterFullScreen()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800">
          <mat-icon class="text-gray-600 dark:text-gray-300">fullscreen</mat-icon>
        </button>
        <!-- 关闭 -->
        <button (click)="closeModal()" class="p-2 rounded-full hover:bg-red-100 dark:hover:bg-red-900/30">
          <mat-icon class="text-red-500">close</mat-icon>
        </button>
      </div>
    </div>

    <!-- Loading 转圈 -->
    <div *ngIf="isLoading" class="flex-1 flex items-center justify-center">
      <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- PDF预览 -->
    <div class="flex-1" *ngIf="!isLoading && pdfUrl">
      <ngx-extended-pdf-viewer
        [src]="pdfUrl"
        [height]="'100%'"
        [width]="'100%'"
        [showDownloadButton]="false"
        [showPrintButton]="false"
        [showOpenFileButton]="false"
        [showBookmarkButton]="false"
        [showSidebarButton]="false"
        [backgroundColor]="isDarkMode ? '#1f2937' : '#ffffff'"
        (loaded)="onPdfLoaded()"
      ></ngx-extended-pdf-viewer>
    </div>
  </div>
</div>
