@if (content) {
  <div class="breadcrumb">
    <ul>
      @for (link of content; track link) {
        <li class="flex items-center gap-1">
          @if (link.icon) {
            <app-icon [content]="link.icon" />
          }
          <app-link [content]="link" />
          <app-icon [content]="{ svg: 'chevron-right' }" />
        </li>
      }
    </ul>
  </div>
}
