@if (content) {
  <div class="search-header p-y-xl">
    @if (content.bg) {
      <app-bg-img [attr.data-path]="'bg'" [content]="content.bg"> </app-bg-img>
    }
    <div class="container search-container">
      <app-text [attr.data-path]="'text'" [content]="content.text" />
      <app-spacer [size]="'sm'" />
      <div class="form-wrap">
        <form [formGroup]="form">



          <div class="relative w-full max-w-3xl mx-auto">
            @if (filterForm && filterForm.length > 0) {
              @for (item of filterForm; track item) {
                @switch (item.key) {
                  @case ('keys') {
                    <input
                      formControlName="{{ item.key }}"
                      matInput
                      placeholder="{{ content.header?.placeholder || item.placeholder || '搜索...' }}"
                      type="search"
                      size="15"
                      maxlength="128"
                      class="form-search text-lg font-bold"
                      (keydown)="onKeydown($event)"
                    />
                      <svg style="top: 50%; transform: translateY(-50%);"
                        class="absolute right-2 w-8 h-8 text-cyan-300 cursor-pointer hover:text-cyan-500"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        (click)="onSearch()"
                      >
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                      </svg>
                  }
                }
              }
            } @else {
              <input
                formControlName="keys"
                matInput
                placeholder="{{ content.header?.placeholder || '搜索...' }}"
                type="search"
                size="15"
                maxlength="128"
                class="form-search"
                (keydown)="onKeydown($event)"
              />
                <svg
                  class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 text-cyan-300 cursor-pointer hover:text-cyan-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  (click)="onSearch()"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            }
          </div>
        </form>
      </div>
    </div>
  </div>
}
